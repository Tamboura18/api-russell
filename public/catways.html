<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catways</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Gestion des Catways</h1>

   <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="catways.html">Catways</a>
    <a href="reservations.html">Réservations</a>
    <a href="user.html">Utilisateurs</a>
    <a href="documentation.html">Documentation</a> 
   </nav>
</header>
<section class="card">

    <h2>Créer un catway</h2>

    <form id="catwayForm">

        <input
            type="number"
            id="catwayNumber"
            placeholder="Numéro"
            required
        >

        <select id="catwayType" required>
            <option value="">Type</option>
            <option value="long">Long</option>
            <option value="short">Short</option>
        </select>

        <input
            type="text"
            id="catwayState"
            placeholder="État"
            required
        >

        <button type="submit">Créer</button>

    </form>

    <p id="catwayMessage"></p>

</section>

<section class="card">

    <h2>Liste des catways</h2>

    <table>

        <thead>
            <tr>
                <th>Numéro</th>
                <th>Type</th>
                <th>État</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="catwaysTable"></tbody>

    </table>

</section>

<script src="js/catway.js"></script>
   
</body>
</html>
